name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, bundle, package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Bundle
        run: npm run package

      # Packaging is the real check: it validates the manifest, the activation
      # events and the files list, which a bundle alone does not.
      - name: Package the extension
        run: npx --yes @vscode/vsce package --out remote-dev-kit.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: remote-dev-kit.vsix
