# Generic remote test stack — ANY language / framework.
#
# Requirement: your project has a Dockerfile that builds a runnable web service
# listening on ${APP_PORT}. That's it. Node, Go, Rust, Python, PHP, static —
# Docker doesn't care what's inside.
#
# Need a database, cache, etc.? Add services below and put them on the `default`
# network (only web-facing services need the `proxy` network + traefik labels).
# For a full Cookiecutter-Django stack, set COMPOSE_FILE=docker-compose.django.yml
# in .env.remote instead.
#
#   ./remote init | up | down   (see README)

networks:
  default: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-coolify}

services:
  app:
    build:
      context: .
      dockerfile: ${APP_DOCKERFILE:-./Dockerfile}
      args:
        # Some frameworks bake config into the client bundle at BUILD time —
        # Next's NEXT_PUBLIC_*, Vite's VITE_*. A runtime env var arrives far too
        # late for those: the value is already compiled into the JS the browser
        # downloads. Declaring them here lets .env.remote set them, and means
        # repointing an app is a rebuild rather than a restart.
        #
        # Unset ones pass through empty and the Dockerfile's own ARG default
        # wins, so this is harmless for projects that don't use them. Compose
        # can't do wildcard arg names, so new ones get added here by hand.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        VITE_API_URL: ${VITE_API_URL:-}
    networks:
      # If you add backing services (db/cache) and share a proxy network that has
      # same-named services (e.g. Coolify), give them a unique alias and point your
      # app at that host — see docker-compose.django.yml for the pattern.
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-coolify}
      - traefik.http.routers.${PROJECT_NAME}-web.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${PROJECT_NAME}-web.entrypoints=${CERT_ENTRYPOINT:-https}
      - traefik.http.routers.${PROJECT_NAME}-web.tls=true
      - traefik.http.routers.${PROJECT_NAME}-web.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${PROJECT_NAME}-web.loadbalancer.server.port=${APP_PORT:-8000}
      # http → https. Coolify's Traefik has no global redirect, so without these
      # labels plain http://APP_HOST 404s. (The bundled Traefik redirects at the
      # entrypoint level too — these are then harmless.)
      - traefik.http.routers.${PROJECT_NAME}-http.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${PROJECT_NAME}-http.entrypoints=${HTTP_ENTRYPOINT:-http}
      - traefik.http.routers.${PROJECT_NAME}-http.middlewares=${PROJECT_NAME}-redirect
      - traefik.http.middlewares.${PROJECT_NAME}-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${PROJECT_NAME}-redirect.redirectscheme.permanent=true
