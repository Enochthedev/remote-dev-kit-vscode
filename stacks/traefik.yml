# Standalone Traefik — turns a BARE VPS (just Docker) into an auto-HTTPS host.
# Run ONCE per server:  ./remote proxy up
#
# Skip this entirely if your VPS already runs a proxy (e.g. Coolify): instead set
# PROXY_NETWORK=coolify in .env.remote and don't run `./remote proxy`.
#
# Entrypoints `http`/`https` + resolver `letsencrypt` are named to match Coolify's
# Traefik, so the exact same app-stack labels work in both modes.

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-web}

volumes:
  traefik_acme: {}

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${PROXY_NETWORK:-web}
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env.remote}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - proxy
